name: Release
# Pushing a version tag (v0.10.0), or running this workflow by hand with a
# version, creates the GitHub Release (and the tag, if missing) and marks it
# latest. The release body is the version's migration note, which must exist
# and be in migrations/registry.json, or the run fails before publishing.
# Kimi Code's `/plugins install https://github.com/linxule/carrel`
# installs the latest release, so a tag without a release is not enough.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.10.0). Tags the current main."
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest versions and the migration note
        run: |
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys, tomllib
          version = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              "plugins/carrel/plugin.json": json.load(open("plugins/carrel/plugin.json"))["version"],
              "kimi.plugin.json": json.load(open("kimi.plugin.json"))["version"],
          }
          wrong = {k: v for k, v in found.items() if v != version}
          if wrong:
              sys.exit(f"Tag v{version} does not match: {wrong}")
          # The migration note is the release body, so it must exist before
          # anything is published. It must also be in the registry, or
          # /carrel-migrate will never show it to researchers.
          registry = json.load(open("migrations/registry.json"))["migrations"]
          entries = [e for e in registry if e["to"] == version]
          if len(entries) != 1:
              sys.exit(
                  f"migrations/registry.json needs exactly one entry with \"to\": \"{version}\" "
                  f"(found {len(entries)}). Add a migration note from migrations/template.md first."
              )
          note = "migrations/" + entries[0]["file"]
          try:
              body = open(note, encoding="utf-8").read().strip()
          except FileNotFoundError:
              sys.exit(f"Registry points at {note}, which does not exist.")
          if not body:
              sys.exit(f"{note} is empty.")
          print(note, file=open("/tmp/release-notes-path", "w"))
          PY
      - name: Create the release from the migration notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(cat /tmp/release-notes-path)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Carrel $VERSION" --notes-file "$NOTES" --latest
