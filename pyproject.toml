[project]
name = "carrel"
version = "0.10.0"
description = "Research environment toolkit -- convert, transcribe, organize"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.28.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "markitdown[docx,pptx,xlsx]>=0.1.9",
    "youtube-transcript-api>=1.2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
carrel = "carrel.cli.main:app"

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/carrel/templates" = ["templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Coverage is opt-in — `uv run pytest --cov` — so the default suite stays fast
# (no --cov in addopts). These settings shape the report when it is requested.
[tool.coverage.run]
source = ["src/carrel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.uv]
package = true
config-settings = { editable_mode = "compat" }

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
